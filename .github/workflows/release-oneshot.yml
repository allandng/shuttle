# Temporary branch-local trigger: publish the v1.0.0 release from main.
# Exists because this automation environment can push to this branch but can
# neither push tags nor dispatch workflows. Idempotent (no-op once the
# release exists); lives only on the working branch, never on main.
name: Release one-shot

on:
  push:
    branches: ["claude/shuttle-repo-review-48w5i8"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create v1.0.0 release at main (if absent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "release v1.0.0 already exists; nothing to do"
            exit 0
          fi
          gh release create v1.0.0 --target main \
            --title "Shuttle v1.0.0" \
            --notes-file .github/releases/v1.0.0.md
